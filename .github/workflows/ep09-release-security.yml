name: YCOS EP-09 local release-security policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-security-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: pnpm
      - name: Enable package manager
        run: corepack enable
      - name: Frozen dependency validation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Local release-security foundation
        run: node infra/cicd/ep09/scripts/run-local-release-pipeline.mjs all
